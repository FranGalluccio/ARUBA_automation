name: Python Playwright Tests - Mobile

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da testare"
        required: true
        default: "test1"
        type: choice
        options:
          - test1
          - test2
          - test-bnl
          - prod-buffetti
          - prod-aruba
      runner:
        description: "Runner da usare"
        required: true
        default: "LAPTOP-7AQM6PC9"
        type: choice
        options:
          - LAPTOP-7AQM6PC9
          - michela
          - lorenzo

jobs:
  test:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostra ambiente selezionato
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $amb = "${{ inputs.ambiente }}"
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  SUITE: PEC Mobile (iPhone 14)" -ForegroundColor Yellow
          Write-Host "  AMBIENTE: $amb" -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Cyan

      - name: Mostra ambiente selezionato (lorenzo)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "========================================"
          echo "  SUITE: PEC Mobile (iPhone 14)"
          echo "  AMBIENTE: ${{ inputs.ambiente }}"
          echo "========================================"

      - name: Install dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Install dependencies (lorenzo)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install chromium

      - name: Run mobile tests
        if: runner.os == 'Windows'
        shell: powershell
        continue-on-error: true
        env:
          PEC_URL: >-
            ${{ inputs.ambiente == 'test2'         && 'https://webmail-test1.test.pec.aruba.it/'
             || inputs.ambiente == 'test-bnl'      && 'https://webmailbnl.test.pec.aruba.it/'
             || inputs.ambiente == 'prod-buffetti' && 'https://webmail.pec.buffetti.it/'
             || inputs.ambiente == 'prod-aruba'    && 'https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth'
             || 'https://webmail.test.pec.aruba.it/' }}
          PEC_INBOX_URL_PATTERN: >-
            ${{ 'INBOX' }}
          PEC_USERNAME: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_USERNAME
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_USERNAME
             || secrets.TEST_PEC_USERNAME }}
          PEC_PASSWORD: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_PASSWORD
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_PASSWORD
             || secrets.TEST_PEC_PASSWORD }}
          PEC_DESTINATARIO_SECONDARIO: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_DESTINATARIO_SECONDARIO
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_DESTINATARIO_SECONDARIO
             || secrets.TEST_PEC_DESTINATARIO_SECONDARIO }}
        run: |
          $reportDir = "pytest_playwright/test-results/mobile"
          if (!(Test-Path $reportDir)) { New-Item -ItemType Directory -Path $reportDir }

          python -m pytest pytest_playwright/mobile/ `
            --junitxml=$reportDir/report.xml `
            --html=$reportDir/report.html `
            --self-contained-html `
            --capture=tee-sys `
            --tb=short `
            --color=yes `
            --browser chromium

      - name: Run mobile tests (lorenzo)
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        env:
          PEC_URL: >-
            ${{ inputs.ambiente == 'test2'         && 'https://webmail-test1.test.pec.aruba.it/'
             || inputs.ambiente == 'test-bnl'      && 'https://webmailbnl.test.pec.aruba.it/'
             || inputs.ambiente == 'prod-buffetti' && 'https://webmail.pec.buffetti.it/'
             || inputs.ambiente == 'prod-aruba'    && 'https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth'
             || 'https://webmail.test.pec.aruba.it/' }}
          PEC_INBOX_URL_PATTERN: >-
            ${{ 'INBOX' }}
          PEC_USERNAME: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_USERNAME
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_USERNAME
             || secrets.TEST_PEC_USERNAME }}
          PEC_PASSWORD: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_PASSWORD
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_PASSWORD
             || secrets.TEST_PEC_PASSWORD }}
          PEC_DESTINATARIO_SECONDARIO: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_DESTINATARIO_SECONDARIO
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_DESTINATARIO_SECONDARIO
             || secrets.TEST_PEC_DESTINATARIO_SECONDARIO }}
        run: |
          reportDir="pytest_playwright/test-results/mobile"
          mkdir -p "$reportDir"

          python3 -m pytest pytest_playwright/mobile/ \
            --junitxml="$reportDir/report.xml" \
            --html="$reportDir/report.html" \
            --self-contained-html \
            --capture=tee-sys \
            --tb=short \
            --color=yes \
            --browser chromium

      - name: Upload JUnit XML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-mobile
          path: pytest_playwright/test-results/mobile/report.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-mobile
          path: pytest_playwright/test-results/mobile/report.html

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-mobile
          path: pytest_playwright/test-results/mobile/**/*.png

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-mobile
          path: pytest_playwright/test-results/failures/mobile/
          if-no-files-found: ignore
