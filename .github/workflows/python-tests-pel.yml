name: Python Playwright Tests - PEL

on:
  push:
    branches: [ "main" ]
    paths:
      - "pytest_pel/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "pytest_pel/**"
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da testare"
        required: true
        default: "test-domini"
        type: choice
        options:
          - test-domini
          - prod-domini
      runner:
        description: "Runner da usare"
        required: true
        default: "LAPTOP-7AQM6PC9"
        type: choice
        options:
          - LAPTOP-7AQM6PC9
          - michela

jobs:
  test:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostra ambiente selezionato
        shell: powershell
        run: |
          $amb = "${{ inputs.ambiente }}"
          if (-not $amb) { $amb = "test-domini (default - push automatico)" }
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  SUITE: PEL" -ForegroundColor Yellow
          Write-Host "  AMBIENTE: $amb" -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Cyan

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run tests
        shell: powershell
        continue-on-error: true
        env:
          PEL_URL: >-
            ${{ inputs.ambiente == 'prod-domini' && 'https://webmail.aruba.it/new/auth/login'
             || 'https://webmaildominitest.aruba.it/new/auth/login' }}
          PEL_INBOX_URL_PATTERN: "INBOX"
          PEL_USERNAME: >-
            ${{ inputs.ambiente == 'prod-domini' && secrets.PROD_DOMINI_PEL_USERNAME
             || secrets.TEST_PEL_USERNAME }}
          PEL_PASSWORD: >-
            ${{ inputs.ambiente == 'prod-domini' && secrets.PROD_DOMINI_PEL_PASSWORD
             || secrets.TEST_PEL_PASSWORD }}
          PEL_DESTINATARIO_SECONDARIO: >-
            ${{ inputs.ambiente == 'prod-domini' && secrets.PROD_DOMINI_PEL_DESTINATARIO_SECONDARIO
             || secrets.TEST_PEL_DESTINATARIO_SECONDARIO }}
        run: |
          $reportDir = "pytest_pel/test-results"
          if (!(Test-Path $reportDir)) { New-Item -ItemType Directory -Path $reportDir }

          python -m pytest pytest_pel/ `
            --junitxml=$reportDir/report.xml `
            --html=$reportDir/report.html `
            --self-contained-html `
            --capture=tee-sys `
            --tb=short `
            --color=yes `
            --browser chromium

      - name: Upload JUnit XML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-pel
          path: pytest_pel/test-results/report.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-pel
          path: pytest_pel/test-results/report.html

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-pel
          path: pytest_pel/test-results/**/*.png

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-pel
          path: pytest_pel/test-results/failures/
          if-no-files-found: ignore
