name: Python Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted
    # Se vuoi specificare Windows, aggiungi labels: [ windows ]
    # labels: [ windows ]

    steps:
      # 1️⃣ Scarica il repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Imposta Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Installa le dipendenze e i browser Playwright
      - name: Install dependencies
        shell: powershell
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright pytest-html
          playwright install

      # 4️⃣ Esegui i test e genera report e screenshot
      - name: Run tests
        shell: powershell
        run: |
          $reportDir = "pytest_playwright/test-results"
          $screenshotsDir = "$reportDir/screenshots"
          if (!(Test-Path $reportDir)) { New-Item -ItemType Directory -Path $reportDir }
          if (!(Test-Path $screenshotsDir)) { New-Item -ItemType Directory -Path $screenshotsDir }

          # Imposta variabile di ambiente per Playwright per salvare screenshot
          $env:PLAYWRIGHT_SCREENSHOT_DIR = $screenshotsDir

          pytest pytest_playwright/ `
            --junitxml=$reportDir/report.xml `
            --html=$reportDir/report.html `
            --self-contained-html `
            --capture=tee-sys

      # 5️⃣ Carica report XML
      - name: Upload JUnit XML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: pytest_playwright/test-results/report.xml

      # 6️⃣ Carica report HTML
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: pytest_playwright/test-results/report.html

      # 7️⃣ Carica screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: pytest_playwright/test-results/screenshots/
