name: Python Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted
    # labels: [ windows ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: powershell
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright pytest-html
          playwright install

      - name: Run tests
        shell: powershell
        continue-on-error: true
        run: |
          $reportDir = "pytest_playwright/test-results"
          if (!(Test-Path $reportDir)) { New-Item -ItemType Directory -Path $reportDir }

          pytest pytest_playwright/ `
            --junitxml=$reportDir/report.xml `
            --html=$reportDir/report.html `
            --self-contained-html `
            --capture=tee-sys `
            --tb=short `
            --color=yes

      - name: Upload JUnit XML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: pytest_playwright/test-results/report.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: pytest_playwright/test-results/report.html

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: pytest_playwright/test-results/**/*.png
