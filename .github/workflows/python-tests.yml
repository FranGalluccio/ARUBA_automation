name: Python Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da testare"
        required: true
        default: "test1"
        type: choice
        options:
          - test1
          - test2
          - test-bnl
          - prod-buffetti
          - prod-aruba

jobs:
  test:
    runs-on: self-hosted
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostra ambiente selezionato
        shell: powershell
        run: |
          $amb = "${{ inputs.ambiente }}"
          if (-not $amb) { $amb = "test1 (default - push automatico)" }
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  AMBIENTE: $amb" -ForegroundColor Yellow
          Write-Host "  URL: ${{ inputs.ambiente == 'test2' && 'https://webmail-test1.test.pec.aruba.it/' || inputs.ambiente == 'prod-buffetti' && 'https://webmail.pec.buffetti.it/' || inputs.ambiente == 'prod-aruba' && 'https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth' || 'https://webmail.test.pec.aruba.it/' }}" -ForegroundColor Yellow
          Write-Host "========================================" -ForegroundColor Cyan

      - name: Install dependencies
        shell: powershell
        run: |
          py -m pip install -r requirements.txt
          py -m playwright install chromium

      - name: Run tests
        shell: powershell
        continue-on-error: true
        env:
          PEC_URL: >-
            ${{ inputs.ambiente == 'test2'         && 'https://webmail-test1.test.pec.aruba.it/'
             || inputs.ambiente == 'test-bnl'      && 'https://accountbnl.testops.aruba.it/pec'
             || inputs.ambiente == 'prod-buffetti' && 'https://webmail.pec.buffetti.it/'
             || inputs.ambiente == 'prod-aruba'    && 'https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth'
             || 'https://webmail.test.pec.aruba.it/' }}
          PEC_INBOX_URL_PATTERN: >-
            ${{ inputs.ambiente == 'test-bnl' && 'pec' || 'INBOX' }}
          PEC_USERNAME: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_USERNAME
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_USERNAME
             || secrets.TEST_PEC_USERNAME }}
          PEC_PASSWORD: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_PASSWORD
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_PASSWORD
             || secrets.TEST_PEC_PASSWORD }}
          PEC_DESTINATARIO_SECONDARIO: >-
            ${{ inputs.ambiente == 'test-bnl'      && secrets.BNL_PEC_DESTINATARIO_SECONDARIO
             || (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba') && secrets.PROD_PEC_DESTINATARIO_SECONDARIO
             || secrets.TEST_PEC_DESTINATARIO_SECONDARIO }}
        run: |
          $reportDir = "pytest_playwright/test-results"
          if (!(Test-Path $reportDir)) { New-Item -ItemType Directory -Path $reportDir }

          py -m pytest pytest_playwright/ `
            --junitxml=$reportDir/report.xml `
            --html=$reportDir/report.html `
            --self-contained-html `
            --capture=tee-sys `
            --tb=short `
            --color=yes `
            --browser chromium

      - name: Upload JUnit XML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: pytest_playwright/test-results/report.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: pytest_playwright/test-results/report.html

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: pytest_playwright/test-results/**/*.png
