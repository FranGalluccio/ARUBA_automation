name: Python Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted   # usa il runner self-hosted
    strategy:
      matrix:
        os: [windows, ubuntu]

    steps:
    # 1️⃣ Scarica il repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Imposta Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3️⃣ Installa le dipendenze e i browser Playwright
    - name: Install dependencies
      shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright
        playwright install

    # 4️⃣ Esegui tutti i test nella cartella pytest_playwright
    - name: Run tests
      shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}
      run: |
        pytest pytest_playwright/
