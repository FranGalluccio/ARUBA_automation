    # 5️⃣ Carica il report XML come artefatto
    - name: Upload JUnit XML report
      uses: actions/upload-artifact@v4   # ← versione aggiornata
      with:
        name: junit-report
        path: report.xml

    # 6️⃣ Carica il report HTML come artefatto
    - name: Upload HTML report
      uses: actions/upload-artifact@v4   # ← versione aggiornata
      with:
        name: html-report
        path: report.html

    # 7️⃣ Carica gli screenshot come artefatto
    - name: Upload screenshots
      uses: actions/upload-artifact@v4   # ← anche qui
      with:
        name: screenshots
        path: path/to/screenshot-folder/
