name: PEC Webmail Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da testare"
        required: true
        default: "test1"
        type: choice
        options:
          - test1
          - test2
          - prod-buffetti
          - prod-aruba

jobs:
  test:
    runs-on: self-hosted

    # Usa l'environment GitHub "test" o "prod" in base all'ambiente scelto.
    # Gli secret (PEC_USERNAME, PEC_PASSWORD, PEC_DESTINATARIO_SECONDARIO) sono
    # definiti separatamente nei due environment e vengono caricati automaticamente.
    environment: >-
      ${{ (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba')
          && 'prod' || 'test' }}

    steps:
      - uses: actions/checkout@v4

      # Ricava l'URL in base all'ambiente scelto (default: test1 su push automatico)
      - name: Imposta URL ambiente
        id: env-config
        shell: bash
        run: |
          case "${{ inputs.ambiente || 'test1' }}" in
            test1)        echo "url=https://webmail.test.pec.aruba.it/" >> "$GITHUB_OUTPUT" ;;
            test2)        echo "url=https://webmail-test1.test.pec.aruba.it/" >> "$GITHUB_OUTPUT" ;;
            prod-buffetti) echo "url=https://webmail.pec.buffetti.it/" >> "$GITHUB_OUTPUT" ;;
            prod-aruba)   echo "url=https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Installa dipendenze
        shell: bash
        run: pip install -r requirements.txt

      - name: Installa Playwright (Chromium)
        shell: bash
        run: playwright install chromium

      # PowerShell per creare il JSON (più sicuro su Windows)
      - name: Crea config.json
        shell: pwsh
        run: |
          $config = [ordered]@{
            pec = [ordered]@{
              url      = "${{ steps.env-config.outputs.url }}"
              username = "${{ secrets.PEC_USERNAME }}"
              password = "${{ secrets.PEC_PASSWORD }}"
            }
            destinatari = [ordered]@{
              destinatario_principale  = "${{ secrets.PEC_USERNAME }}"
              destinatario_secondario  = "${{ secrets.PEC_DESTINATARIO_SECONDARIO }}"
            }
            test_folder        = "pytest_playwright"
            report_folder      = "pytest_playwright/test-results"
            file_allegato      = "dati_test/allegato-test.pdf"
            importa_messaggi   = "dati_test/messaggio importato automation playwright.eml"
            rubrica_import     = "dati_test/rubrica.csv"
            calendario_import  = "dati_test/calendario-test.ics"
          }
          $config | ConvertTo-Json -Depth 3 | Set-Content -Path "pytest_playwright/config.json" -Encoding UTF8
          Write-Host "config.json creato:"
          Get-Content "pytest_playwright/config.json"

      - name: Esegui test
        shell: bash
        run: python -m pytest pytest_playwright/ -v --browser chromium

      - name: Carica artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.ambiente || 'test1' }}
          path: |
            report.html
            pytest_playwright/test-results/
          retention-days: 14
