name: PEC Webmail Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da testare"
        required: true
        default: "test1"
        type: choice
        options:
          - test1
          - test2
          - prod-buffetti
          - prod-aruba

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Playwright (Chromium)
        run: playwright install chromium

      - name: Esegui test
        run: python -m pytest pytest_playwright/ -v --browser chromium
        env:
          PEC_URL: >-
            ${{ inputs.ambiente == 'test2'         && 'https://webmail-test1.test.pec.aruba.it/'
             || inputs.ambiente == 'prod-buffetti' && 'https://webmail.pec.buffetti.it/'
             || inputs.ambiente == 'prod-aruba'    && 'https://login.aruba.it/auth/realms/pec/protocol/openid-connect/auth'
             || 'https://webmail.test.pec.aruba.it/' }}
          PEC_USERNAME: >-
            ${{ (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba')
                && secrets.PROD_PEC_USERNAME || secrets.TEST_PEC_USERNAME }}
          PEC_PASSWORD: >-
            ${{ (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba')
                && secrets.PROD_PEC_PASSWORD || secrets.TEST_PEC_PASSWORD }}
          PEC_DESTINATARIO_SECONDARIO: >-
            ${{ (inputs.ambiente == 'prod-buffetti' || inputs.ambiente == 'prod-aruba')
                && secrets.PROD_PEC_DESTINATARIO_SECONDARIO || secrets.TEST_PEC_DESTINATARIO_SECONDARIO }}

      - name: Carica artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.ambiente || 'test1' }}
          path: |
            report.html
            pytest_playwright/test-results/
          retention-days: 14
