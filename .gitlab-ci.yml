stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test-pec-webmail:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.49.0-jammy
  before_script:
    - pip install -r requirements.txt
    - playwright install chromium
    - |
      cat > pytest_playwright/config.json << CONF
      {
        "pec": {
          "url": "${PEC_URL}",
          "username": "${PEC_USERNAME}",
          "password": "${PEC_PASSWORD}"
        },
        "destinatari": {
          "destinatario_principale": "${PEC_USERNAME}",
          "destinatario_secondario": "${PEC_DESTINATARIO_SECONDARIO}"
        },
        "test_folder": "pytest_playwright",
        "report_folder": "pytest_playwright/test-results",
        "file_allegato": "dati_test/allegato-test.pdf",
        "importa_messaggi": "dati_test/messaggio importato automation playwright.eml",
        "rubrica_import": "dati_test/rubrica.csv",
        "calendario_import": "dati_test/calendario-test.ics"
      }
      CONF
  script:
    - python -m pytest pytest_playwright/ -v --browser chromium
  after_script:
    - echo "Test completati"
  artifacts:
    when: always
    paths:
      - report.html
      - pytest_playwright/test-results/
    expire_in: 2 weeks
  timeout: 90 minutes
