stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# ─── Template riutilizzabile ────────────────────────────────────────────────
.test-template:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.49.0-jammy
  before_script:
    - pip install -r requirements.txt
    - playwright install chromium
    - |
      cat > pytest_playwright/config.json << CONF
      {
        "pec": {
          "url": "${PEC_URL}",
          "username": "${PEC_USERNAME}",
          "password": "${PEC_PASSWORD}"
        },
        "destinatari": {
          "destinatario_principale": "${PEC_USERNAME}",
          "destinatario_secondario": "${PEC_DESTINATARIO_SECONDARIO}"
        },
        "test_folder": "pytest_playwright",
        "report_folder": "pytest_playwright/test-results",
        "file_allegato": "dati_test/allegato-test.pdf",
        "importa_messaggi": "dati_test/messaggio importato automation playwright.eml",
        "rubrica_import": "dati_test/rubrica.csv",
        "calendario_import": "dati_test/calendario-test.ics"
      }
      CONF
  script:
    - python -m pytest pytest_playwright/ -v --browser chromium
  after_script:
    - echo "Test completati - ambiente ${ENV_NAME}"
  artifacts:
    when: always
    paths:
      - report.html
      - pytest_playwright/test-results/
    expire_in: 2 weeks
  timeout: 90 minutes

# ─── Ambiente TEST 1 (webmail.test.pec.aruba.it) ────────────────────────────
# Gira automaticamente su push a main
test-env-test1:
  extends: .test-template
  variables:
    ENV_NAME: "test1"
    PEC_URL: "https://webmail.test.pec.aruba.it/"
    PEC_USERNAME: "${TEST_PEC_USERNAME}"
    PEC_PASSWORD: "${TEST_PEC_PASSWORD}"
    PEC_DESTINATARIO_SECONDARIO: "${TEST_PEC_DESTINATARIO_SECONDARIO}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# ─── Ambiente TEST 2 (webmail-test1.test.pec.aruba.it) ──────────────────────
# Solo manuale (env aggiuntivo)
test-env-test2:
  extends: .test-template
  variables:
    ENV_NAME: "test2"
    PEC_URL: "https://webmail-test1.test.pec.aruba.it/"
    PEC_USERNAME: "${TEST_PEC_USERNAME}"
    PEC_PASSWORD: "${TEST_PEC_PASSWORD}"
    PEC_DESTINATARIO_SECONDARIO: "${TEST_PEC_DESTINATARIO_SECONDARIO}"
  rules:
    - when: manual
  allow_failure: true

# ─── Ambiente PROD - Buffetti (webmail.pec.buffetti.it) ─────────────────────
# Solo manuale
test-prod-buffetti:
  extends: .test-template
  variables:
    ENV_NAME: "prod-buffetti"
    PEC_URL: "https://webmail.pec.buffetti.it/"
    PEC_USERNAME: "${PROD_PEC_USERNAME}"
    PEC_PASSWORD: "${PROD_PEC_PASSWORD}"
    PEC_DESTINATARIO_SECONDARIO: "${PROD_PEC_DESTINATARIO_SECONDARIO}"
